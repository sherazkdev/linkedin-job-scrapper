services:
  api-test:
    profiles:
      - api-test
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: global-jobs-api-test
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MONGO_DB_NAME: global_jobs_test
    ports:
      - "127.0.0.1:18085:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: global-jobs-api
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "127.0.0.1:8085:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  mongodb:
    image: mongo:7.0.16
    container_name: global-jobs-mongodb
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_ROOT_USER}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 40s

  worker-linkedin:
    profiles:
      - celery-linkedin
    build:
      context: .
      dockerfile: Dockerfile.collector
    image: global-jobs-collector-worker
    container_name: global-jobs-worker-linkedin
    env_file:
      - .env
    environment:
      CELERY_WORKER_MONGO_DB_NAME: global_jobs_test
      ALLOW_COLLECTION_PRODUCTION_DB: "false"
      ALLOW_LIVE_LINKEDIN_COLLECTION: "false"
      CELERY_ALLOW_LINKEDIN_TASKS: "false"
      CELERY_WORKER_CONCURRENCY: 1
      CELERY_DISPATCH_MAX_PER_TICK: 1
      CELERY_TASK_TIME_LIMIT: 900
      CELERY_TASK_SOFT_TIME_LIMIT: 840
      LINKEDIN_STORAGE_STATE_PATH: /data/linkedin/storage_state.json
      # Align with successful manual collector runs (see docs/LINKEDIN_COLLECTION.md)
      COLLECTION_ADAPTER_TIMEOUT_SECONDS: "600"
      LINKEDIN_COLLECTION_ADAPTER_TIMEOUT_SECONDS: "600"
      LINKEDIN_NAVIGATION_TIMEOUT_MS: "30000"
      LINKEDIN_SELECTOR_TIMEOUT_MS: "45000"
      LINKEDIN_PAGE_OPERATION_TIMEOUT_MS: "30000"
      LINKEDIN_BROWSER_SHUTDOWN_GRACE_MS: "20000"
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=${LOG_LEVEL:-INFO}
      --queues=collection
      --pool=solo
      --concurrency=1
      --hostname=linkedin-worker@%h
    volumes:
      - linkedin_auth:/data/linkedin
      - ./config:/app/config:ro
      - ./app:/app/app:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    init: true
    security_opt:
      - seccomp:unconfined
    shm_size: "512mb"
    restart: unless-stopped

  worker:
    profiles:
      - celery
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: global-jobs-worker
    container_name: global-jobs-worker
    env_file:
      - .env
    environment:
      CELERY_WORKER_MONGO_DB_NAME: global_jobs_test
      ALLOW_COLLECTION_PRODUCTION_DB: "false"
      ALLOW_LIVE_LINKEDIN_COLLECTION: "false"
      CELERY_ALLOW_LINKEDIN_TASKS: "false"
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=${LOG_LEVEL:-INFO}
      --queues=collection
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      --hostname=worker@%h
    volumes:
      - ./config:/app/config:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli.celery_ops", "ping"]
      interval: 45s
      timeout: 30s
      retries: 3
      start_period: 90s

  beat:
    profiles:
      - celery
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: global-jobs-worker
    container_name: global-jobs-beat
    env_file:
      - .env
    environment:
      CELERY_WORKER_MONGO_DB_NAME: global_jobs_test
      ALLOW_COLLECTION_PRODUCTION_DB: "false"
      ALLOW_LIVE_LINKEDIN_COLLECTION: "false"
      CELERY_ALLOW_LINKEDIN_TASKS: "false"
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=${LOG_LEVEL:-INFO}
      --schedule=/var/lib/celerybeat/celerybeat-schedule
    volumes:
      - celerybeat_data:/var/lib/celerybeat
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  collector:
    profiles:
      - collector
    build:
      context: .
      dockerfile: Dockerfile.collector
    image: global-jobs-collector
    container_name: global-jobs-collector
    env_file:
      - .env
    environment:
      LINKEDIN_STORAGE_STATE_PATH: /data/linkedin/storage_state.json
    volumes:
      - linkedin_auth:/data/linkedin
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    init: true
    security_opt:
      - seccomp:unconfined
    shm_size: "512mb"
    restart: "no"

  redis:
    image: redis:7.4.2-bookworm
    container_name: global-jobs-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  mongodb_data:
    name: global_jobs_mongodb_data
  redis_data:
    name: global_jobs_redis_data
  linkedin_auth:
    name: global_jobs_linkedin_auth
  celerybeat_data:
    name: global_jobs_celerybeat_data

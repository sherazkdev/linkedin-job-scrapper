# Private loopback staging UI → pilot API only (global_jobs_pilot).
# Usage:
#   FRONTEND_STAGING_GIT_SHA=$(git rev-parse HEAD) bash scripts/_vps_frontend_staging_deploy.sh

services:
  frontend-staging:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${FRONTEND_STAGING_GIT_SHA:-unknown}
        PILOT_API_BASE_URL: http://api-pilot:8000
        PUBLIC_JOBS_API_BASE_URL: http://api-pilot:8000
        APP_URL: ${FRONTEND_STAGING_APP_URL:-http://127.0.0.1:13010}
    image: linkedin-scraper-frontend-staging:${FRONTEND_STAGING_GIT_SHA:-latest}
    container_name: linkedin-scraper-frontend-staging
    environment:
      NODE_ENV: production
      GIT_COMMIT_SHA: ${FRONTEND_STAGING_GIT_SHA:-unknown}
      PILOT_API_BASE_URL: http://api-pilot:8000
      PUBLIC_JOBS_API_BASE_URL: http://api-pilot:8000
      APP_URL: ${FRONTEND_STAGING_APP_URL:-http://127.0.0.1:13010}
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${FRONTEND_STAGING_PORT:-13010}:3000"
    depends_on:
      api-pilot:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped